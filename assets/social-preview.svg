<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"><rect width="1280" height="640" fill="#f3f7f8"/><g font-family="Microsoft YaHei,SimHei,sans-serif"><text x="68" y="86" fill="#007e87" font-size="22">HOW TO COMPETE BETTER</text><text x="68" y="182" fill="#162c3b" font-size="58" font-weight="700">高性价比大学生竞赛指南</text><text x="68" y="247" fill="#526673" font-size="29">先找适合自己的比赛，再用Agent做出完整作品。</text><rect x="68" y="301" width="1144" height="158" rx="19" fill="white" stroke="#dbe5e8"/><text x="101" y="361" fill="#007e87" font-size="33" font-weight="700">27项制作参考　·　73张赛事卡　·　数模完整实战</text><text x="101" y="411" fill="#526673" font-size="25">当届建议、成本未知项、人工任务与工具步骤分别写清。</text><text x="68" y="540" fill="#162c3b" font-size="26">按问题导航 → 点比赛看详情 → 跑一个最小成果</text><text x="68" y="596" fill="#007e87" font-size="21">github.com/Rain-dust/HowToCompeteBetter</text></g></svg>